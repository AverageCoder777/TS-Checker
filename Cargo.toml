[package]
name = "TSC_Check_Tool"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.7.0"
rfd = "0.17"
walkdir = "2.5"
rayon = "1.12"
zip = { version = "9", default-features = false, features = ["deflate"] }
regex = "1.13"
tempfile = "3.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.18.1"
xml = "1.4"
ddsfile = "0.6"
texture2ddecoder = "0.1.2"
image = { version = "0.25", default-features = false, features = ["png"] }
bytemuck = { version = "1.25", features = ["derive"] }
notify = "8.2.1"
open = "5.4.4"
encoding_rs = "0.8"

[build-dependencies]
slint-build = "1.18.1"
